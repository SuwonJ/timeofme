<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>SuwonJ's timeto.me</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="style.css?v=26" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,200..900&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    </head>
    <body>
        <header class="dashboard-header">
            <div class="header-logo-group">
                <h1 class="logo">timeof.me</h1>
                <span class="logo-sub">time of @suwonmars</span>
            </div>
            <div class="header-controls">
                <div class="date-navigator">
                    <button id="prev-day-btn" class="nav-btn">◀</button>
                    <input type="date" id="date-picker">
                    <button id="next-day-btn" class="nav-btn">▶</button>
                    <button id="yesterday-btn" class="nav-btn">Today</button>
                </div>
                <div class="tabs">
                    <button class="tab-link active" data-range="daily">Daily</button>
                    <button class="tab-link" data-range="weekly">Weekly</button>
                    <button class="tab-link" data-range="monthly">Monthly</button>
                </div>
            </div>
        </header>
        <section id="dashboard" class="stats-grid"></section>

        <main class="dashboard-layout">
            <!-- Left Column: Timeline Details -->
            <div class="layout-col col-left">
                <div class="panel-header">
                    <h2>Chronology</h2>
                </div>
                <section id="details"></section>
            </div>

            <!-- Right Column: Charts & Tasks -->
            <div class="layout-col col-right">
                <section id="insights">
                    <div class="panel-header">
                        <h2>Analysis</h2>
                    </div>
                    <div id="activity-chart-container" class="chart-card">
                        <div class="chart-header">
                            <h3>Activity Share</h3>
                            <div class="chart-type-switcher">
                                <button class="chart-type-btn active" data-charttype="bar">Bar</button>
                                <button class="chart-type-btn" data-charttype="pie">Pie</button>
                                <button class="chart-type-btn" data-charttype="doughnut">Doughnut</button>
                            </div>
                        </div>
                        <div class="chart-filters">
                            <label><input type="checkbox" id="exclude-common"> Exclude Routines & Sleep</label>
                        </div>
                        <div class="canvas-wrapper">
                            <canvas id="activityChart"></canvas>
                        </div>
                    </div>
                    <div id="sleep-analysis-container" class="chart-card">
                         <h3>Sleep Diagnostics</h3>
                         <div id="sleep-analysis"></div>
                    </div>
                </section>

                <section id="tasks-section"></section>
            </div>
        </main>

        <script src="script.js?v=26"></script>
    </body>
</html>
